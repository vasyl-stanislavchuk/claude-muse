# How medallion's `md` CLI installs claude-muse and launches sessions on it.
# The contract is md's docs/agents/plugins-contract.md; `[driver]` needs contract 2.

[plugin]
id = "claude-muse"
name = "Muse"
summary = "Claude Code running Meta's muse-spark-1.3."
contract = 2

[install]
requires = ["claude", "jq", "muse", "curl"]
steps = [
  { argv = ["{checkout}/install.sh", "--check"] },
  { argv = ["{checkout}/install.sh"] },
]

# md runs `argv` wherever it would run `claude`, with claude's own flags, and sets
# CLAUDE_CONFIG_DIR to `config_dir` on the spawn so it finds the session there afterwards.
[driver]
label = "Muse"
model = "muse-spark-1.3"
argv = ["{checkout}/bin/claude-muse"]
config_dir = "~/.claude-profiles/muse"
