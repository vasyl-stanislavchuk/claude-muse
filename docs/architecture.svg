<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d0-title d0-desc">
  <title id="d0-title">One localhost hop between Claude Code and muse-spark</title>
  <desc id="d0-desc">Claude Code sends every request through one local proxy that repairs rejected shapes, retries transient failures, and records state; responses return to Claude Code.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6b85"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2941f3"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f7f76"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#fbfcfe"/>

  <!-- ============ zone ============ -->
  <rect x="232" y="128" width="448" height="232" rx="12" fill="rgba(4,8,16,0.015)" stroke="rgba(4,8,16,0.07)" stroke-width="0.8"/>
  <rect x="368" y="132" width="176" height="12" rx="2" fill="#fbfcfe"/>
  <text x="456" y="141" fill="rgba(4,8,16,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOCALHOST PROXY 127.0.0.1:8787</text>

  <text x="112" y="140" fill="rgba(4,8,16,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT</text>

  <!-- ============ arrows (before boxes) ============ -->
  <!-- Claude Code -> proxy -->
  <line x1="184" y1="188" x2="296" y2="188" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="212" y="168" width="56" height="12" rx="2" fill="#fbfcfe"/>
  <text x="240" y="177" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>

  <!-- proxy -> api.meta.ai -->
  <line x1="616" y1="188" x2="744" y2="188" stroke="#0f7f76" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="652" y="168" width="56" height="12" rx="2" fill="#fbfcfe"/>
  <text x="680" y="177" fill="#0f7f76" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

  <!-- api.meta.ai -> Claude Code (response returns to the client) -->
  <path d="M 832,216 V 392 Q 832,400 824,400 H 120 Q 112,400 112,392 V 216" fill="none" stroke="#5a6b85" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="444" y="380" width="56" height="12" rx="2" fill="#fbfcfe"/>
  <text x="472" y="389" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text>

  <!-- state -> proxy (reads rules) -->
  <line x1="352" y1="256" x2="352" y2="232" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="302" y="238" width="44" height="12" rx="2" fill="#fbfcfe"/>
  <text x="324" y="247" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RULES</text>

  <!-- proxy -> state (learns a rejected field) -->
  <line x1="400" y1="232" x2="400" y2="256" stroke="#5a6b85" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="406" y="238" width="48" height="12" rx="2" fill="#fbfcfe"/>
  <text x="430" y="247" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEARNS</text>

  <!-- preflight -> proxy (launch-time start) -->
  <line x1="556" y1="256" x2="556" y2="232" stroke="#5a6b85" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="562" y="238" width="48" height="12" rx="2" fill="#fbfcfe"/>
  <text x="586" y="247" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STARTS</text>

  <!-- ============ nodes ============ -->
  <!-- Claude Code (input) -->
  <rect x="40" y="160" width="144" height="56" rx="6" fill="#fbfcfe"/>
  <rect x="40" y="160" width="144" height="56" rx="6" fill="#ffffff" stroke="#7888a0" stroke-width="1"/>
  <text x="112" y="188" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Claude Code</text>
  <text x="112" y="204" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">muse profile</text>

  <!-- proxy (focal) -->
  <rect x="296" y="160" width="320" height="72" rx="6" fill="#fbfcfe"/>
  <rect x="296" y="160" width="320" height="72" rx="6" fill="rgba(41,65,243,0.10)" stroke="#2941f3" stroke-width="1.5"/>
  <text x="456" y="184" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Proxy</text>
  <text x="456" y="200" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">repair · retry · record</text>
  <text x="456" y="216" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">detail in D1 · request</text>

  <!-- api.meta.ai (external) -->
  <rect x="744" y="160" width="176" height="56" rx="6" fill="#fbfcfe"/>
  <rect x="744" y="160" width="176" height="56" rx="6" fill="#ffffff" stroke="#7888a0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="832" y="188" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">api.meta.ai</text>
  <text x="832" y="204" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">muse-spark-1.3</text>

  <!-- runtime state (store) -->
  <rect x="264" y="256" width="184" height="72" rx="6" fill="#fbfcfe"/>
  <rect x="264" y="256" width="184" height="72" rx="6" fill="rgba(90,107,133,0.08)" stroke="#667997" stroke-width="1"/>
  <text x="356" y="280" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Runtime state</text>
  <text x="356" y="296" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~/.config/claude-muse/</text>
  <text x="356" y="312" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">learned · shapes · log</text>

  <!-- preflight (backend) -->
  <rect x="464" y="256" width="184" height="72" rx="6" fill="#fbfcfe"/>
  <rect x="464" y="256" width="184" height="72" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <text x="556" y="292" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Preflight</text>
  <text x="556" y="308" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">starts · verifies</text>
  <text x="556" y="346" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">detail in D4 · launch</text>

  <!-- ============ legend ============ -->
  <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(9,22,40,0.12)" stroke-width="0.8"/>
  <text x="40" y="459" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="140" y="450" width="12" height="12" rx="2" fill="rgba(41,65,243,0.10)" stroke="#2941f3" stroke-width="1.5"/>
  <text x="158" y="459" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL POINT</text>

  <rect x="260" y="450" width="12" height="12" rx="2" fill="rgba(90,107,133,0.08)" stroke="#667997" stroke-width="1"/>
  <text x="278" y="459" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STATE ON DISK</text>

  <rect x="386" y="450" width="12" height="12" rx="2" fill="#ffffff" stroke="#7888a0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="404" y="459" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">OUTSIDE THIS REPO</text>

  <line x1="538" y1="456" x2="558" y2="456" stroke="#0f7f76" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="566" y="459" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTPS CALL</text>

  <line x1="662" y1="456" x2="682" y2="456" stroke="#5a6b85" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="690" y="459" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN PATH</text>

  <!-- ============ gaps strip ============ -->
  <line x1="40" y1="488" x2="920" y2="488" stroke="rgba(9,22,40,0.12)" stroke-width="0.8"/>
  <text x="40" y="507" fill="#2941f3" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NOT REPAIRED</text>

  <text x="176" y="507" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SAFETY CLASSIFIER PAYS FULL REASONING</text>
  <text x="430" y="507" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">COUNT_TOKENS IS AN ESTIMATE</text>
  <text x="660" y="507" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SOURCES ONLY FOR OPENED PAGES</text>
</svg>
