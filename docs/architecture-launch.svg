<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 992 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d4-title d4-desc">
  <title id="d4-title">Launch and probe loop: free until the code moves</title>
  <desc id="d4-desc">Preflight pins the base URL, starts the proxy, and only spends two probe calls when the engine hash changed; probe.sh replays the same shapes manually.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6b85"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2941f3"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f7f76"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#fbfcfe"/>

  <!-- ============ arrows (before boxes) ============ -->
  <!-- main launch path -->
  <line x1="160" y1="188" x2="192" y2="188" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="312" y1="188" x2="344" y2="188" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="464" y1="188" x2="496" y2="188" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="616" y1="188" x2="680" y2="188" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="622" y="168" width="52" height="12" rx="2" fill="#fbfcfe"/>
  <text x="648" y="177" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHANGED</text>
  <line x1="800" y1="188" x2="832" y2="188" stroke="#2941f3" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- free path over the probe -->
  <path d="M 556,160 V 128 Q 556,120 564,120 H 884 Q 892,120 892,128 V 160" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="698" y="100" width="52" height="12" rx="2" fill="#fbfcfe"/>
  <text x="724" y="109" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CURRENT</text>

  <!-- manual harness shares the probe shapes -->
  <line x1="740" y1="256" x2="740" y2="216" stroke="#5a6b85" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="658" y="230" width="76" height="12" rx="2" fill="#fbfcfe"/>
  <text x="696" y="239" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SHARES SHAPES</text>

  <!-- escape-hatch annotations -->
  <text x="556" y="244" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SKIP_PROBE=1 takes CURRENT</text>
  <text x="140" y="244" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DIRECT=1 skips proxy · breaks search</text>

  <!-- ============ nodes ============ -->
  <!-- 1 shell -->
  <rect x="40" y="160" width="120" height="56" rx="6" fill="#fbfcfe"/>
  <rect x="40" y="160" width="120" height="56" rx="6" fill="#ffffff" stroke="#7888a0" stroke-width="1"/>
  <rect x="48" y="166" width="20" height="12" rx="2" fill="transparent" stroke="rgba(120,136,160,0.50)" stroke-width="0.8"/>
  <text x="58" y="175" fill="rgba(90,107,133,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1</text>
  <text x="100" y="192" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Shell fn</text>
  <text x="100" y="208" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sources env</text>

  <!-- 2 model-env -->
  <rect x="192" y="160" width="120" height="56" rx="6" fill="#fbfcfe"/>
  <rect x="192" y="160" width="120" height="56" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <rect x="200" y="166" width="20" height="12" rx="2" fill="transparent" stroke="rgba(90,107,133,0.40)" stroke-width="0.8"/>
  <text x="210" y="175" fill="rgba(90,107,133,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2</text>
  <text x="252" y="192" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">model-env</text>
  <text x="252" y="208" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">identity env</text>

  <!-- 3 pin + start -->
  <rect x="344" y="160" width="120" height="56" rx="6" fill="#fbfcfe"/>
  <rect x="344" y="160" width="120" height="56" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <rect x="352" y="166" width="20" height="12" rx="2" fill="transparent" stroke="rgba(90,107,133,0.40)" stroke-width="0.8"/>
  <text x="362" y="175" fill="rgba(90,107,133,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3</text>
  <text x="404" y="192" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Pin + start</text>
  <text x="404" y="208" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">URL · launchd</text>

  <!-- 4 hash check -->
  <rect x="496" y="160" width="120" height="56" rx="6" fill="#fbfcfe"/>
  <rect x="496" y="160" width="120" height="56" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <rect x="504" y="166" width="20" height="12" rx="2" fill="transparent" stroke="rgba(90,107,133,0.40)" stroke-width="0.8"/>
  <text x="514" y="175" fill="rgba(90,107,133,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">4</text>
  <text x="556" y="192" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Up to date?</text>
  <text x="556" y="208" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hash vs disk</text>

  <!-- 5 paid probe (focal) -->
  <rect x="680" y="160" width="120" height="56" rx="6" fill="#fbfcfe"/>
  <rect x="680" y="160" width="120" height="56" rx="6" fill="rgba(41,65,243,0.10)" stroke="#2941f3" stroke-width="1.5"/>
  <rect x="688" y="166" width="20" height="12" rx="2" fill="transparent" stroke="rgba(41,65,243,0.40)" stroke-width="0.8"/>
  <text x="698" y="175" fill="rgba(41,65,243,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">5</text>
  <text x="740" y="192" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Paid probe</text>
  <text x="740" y="208" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 calls · verified</text>

  <!-- 6 exec -->
  <rect x="832" y="160" width="120" height="56" rx="6" fill="#fbfcfe"/>
  <rect x="832" y="160" width="120" height="56" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <rect x="840" y="166" width="20" height="12" rx="2" fill="transparent" stroke="rgba(90,107,133,0.40)" stroke-width="0.8"/>
  <text x="850" y="175" fill="rgba(90,107,133,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">6</text>
  <text x="892" y="192" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Exec Claude</text>
  <text x="892" y="208" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proxy ready</text>

  <!-- manual harness -->
  <rect x="620" y="256" width="240" height="72" rx="6" fill="#fbfcfe"/>
  <rect x="620" y="256" width="240" height="72" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <rect x="628" y="262" width="32" height="12" rx="2" fill="transparent" stroke="rgba(90,107,133,0.40)" stroke-width="0.8"/>
  <text x="644" y="271" fill="rgba(90,107,133,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="740" y="288" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">probe.sh</text>
  <text x="740" y="304" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replays shapes · raw vs proxy</text>
  <text x="740" y="320" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">raw-only rows teach learned.json</text>

  <!-- ============ legend reminder ============ -->
  <line x1="40" y1="360" x2="952" y2="360" stroke="rgba(9,22,40,0.12)" stroke-width="0.8"/>
  <line x1="40" y1="376" x2="64" y2="376" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="72" y="379" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FORWARD</text>
  <line x1="180" y1="376" x2="204" y2="376" stroke="#5a6b85" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="212" y="379" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SHARES</text>
  <rect x="300" y="370" width="12" height="12" rx="2" fill="rgba(41,65,243,0.10)" stroke="#2941f3" stroke-width="1.5"/>
  <text x="318" y="379" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL</text>
</svg>
