<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc">
  <title id="d3-title">Relay and retry: three failure classes, three treatments</title>
  <desc id="d3-desc">Transient failures wait and resend, 400s learn fields and resend, and request-scoped stops serve with a hint; a cooldown gate fast-paths overload.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6b85"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2941f3"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f7f76"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#fbfcfe"/>

  <!-- ============ arrows (before boxes) ============ -->
  <!-- entry -->
  <line x1="448" y1="124" x2="448" y2="148" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- cooldown exits -->
  <line x1="448" y1="228" x2="448" y2="260" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="454" y="234" width="28" height="12" rx="2" fill="#fbfcfe"/>
  <text x="468" y="243" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
  <path d="M 368,188 H 88 Q 80,188 80,196 V 658 Q 80,666 88,666 H 360" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="86" y="380" width="60" height="12" rx="2" fill="#fbfcfe"/>
  <text x="116" y="389" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES · 503</text>

  <!-- send -> outcome -->
  <line x1="448" y1="316" x2="448" y2="340" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- outcome exits -->
  <line x1="536" y1="384" x2="616" y2="384" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="548" y="364" width="56" height="12" rx="2" fill="#fbfcfe"/>
  <text x="576" y="373" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRANSIENT</text>
  <line x1="448" y1="428" x2="448" y2="460" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="454" y="434" width="32" height="12" rx="2" fill="#fbfcfe"/>
  <text x="470" y="443" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">400</text>
  <path d="M 360,384 H 200 Q 192,384 192,392 V 576 Q 192,584 200,584 H 360" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="234" y="364" width="84" height="12" rx="2" fill="#fbfcfe"/>
  <text x="276" y="373" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STOP·SERVE+HINT</text>

  <!-- resend loops -->
  <path d="M 792,384 H 872 Q 880,384 880,376 V 288 Q 880,280 872,280 H 536" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="686" y="260" width="44" height="12" rx="2" fill="#fbfcfe"/>
  <text x="708" y="269" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESEND</text>
  <path d="M 536,492 H 832 Q 840,492 840,484 V 316 Q 840,308 832,308 H 536" fill="none" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="648" y="288" width="80" height="12" rx="2" fill="#fbfcfe"/>
  <text x="688" y="297" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REWRITE → SEND</text>

  <!-- pump -> end -->
  <line x1="448" y1="612" x2="448" y2="644" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ nodes ============ -->
  <!-- start -->
  <rect x="360" y="80" width="176" height="44" rx="20" fill="#fbfcfe"/>
  <rect x="360" y="80" width="176" height="44" rx="20" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <text x="448" y="107" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Repaired request</text>

  <!-- cooldown decision -->
  <polygon points="368,188 448,148 528,188 448,228" fill="#fbfcfe" stroke="#fbfcfe" stroke-width="1"/>
  <polygon points="368,188 448,148 528,188 448,228" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <text x="448" y="192" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">In cooldown?</text>

  <!-- send -->
  <rect x="360" y="260" width="176" height="56" rx="6" fill="#fbfcfe"/>
  <rect x="360" y="260" width="176" height="56" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <text x="448" y="288" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">HTTPS send</text>
  <text x="448" y="304" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">200s prefix-checked</text>

  <!-- outcome decision (focal) -->
  <polygon points="360,384 448,340 536,384 448,428" fill="#fbfcfe" stroke="#fbfcfe" stroke-width="1"/>
  <polygon points="360,384 448,340 536,384 448,428" fill="rgba(41,65,243,0.10)" stroke="#2941f3" stroke-width="1.5"/>
  <text x="448" y="388" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Outcome?</text>

  <!-- wait -->
  <rect x="616" y="356" width="176" height="56" rx="6" fill="#fbfcfe"/>
  <rect x="616" y="356" width="176" height="56" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <text x="704" y="384" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Wait</text>
  <text x="704" y="400" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">≤30s · ×3 · else cooldown</text>

  <!-- learn -->
  <rect x="360" y="460" width="176" height="64" rx="6" fill="#fbfcfe"/>
  <rect x="360" y="460" width="176" height="64" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <text x="448" y="488" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Remember + rewrite</text>
  <text x="448" y="504" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">400 fields · tries ≤6</text>

  <!-- pump -->
  <rect x="360" y="556" width="176" height="56" rx="6" fill="#fbfcfe"/>
  <rect x="360" y="556" width="176" height="56" rx="6" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <text x="448" y="584" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Pump</text>
  <text x="448" y="600" fill="#5a6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SSE · JSON · pass</text>

  <!-- end -->
  <rect x="360" y="644" width="176" height="44" rx="20" fill="#fbfcfe"/>
  <rect x="360" y="644" width="176" height="44" rx="20" fill="#ffffff" stroke="#5a6b85" stroke-width="1"/>
  <text x="448" y="671" fill="#040810" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Respond</text>

  <!-- ============ legend reminder ============ -->
  <line x1="40" y1="720" x2="880" y2="720" stroke="rgba(9,22,40,0.12)" stroke-width="0.8"/>
  <line x1="40" y1="736" x2="64" y2="736" stroke="#5a6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="72" y="739" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FLOW</text>
  <polygon points="172,730 184,736 172,742 160,736" fill="rgba(41,65,243,0.10)" stroke="#2941f3" stroke-width="1.5"/>
  <text x="192" y="739" fill="#5a6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL DECISION</text>
</svg>
